[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl"
version = "0.1.0"
description = "Financial reinforcement learning research environment"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["finrl*"]
