[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finrl"
version = "0.1.0"
description = "Financial reinforcement learning research environment"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "gymnasium>=0.29",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]
sb3 = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]
all_rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]
openai = [
    "openai",
]
local_llm = [
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["finrl*"]
